name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn clean install
        working-directory: ./greetingsAPI  # Ajuste este caminho conforme necessário

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_KEY_JSON }}'

      - name: Configure Docker for Google Container Registry
        run: gcloud auth configure-docker

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/greetings:latest .
          docker push ${{ secrets.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/greetings:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up remote repository
        run: |
          git remote remove origin
          git remote add origin https://github.com/maximianoneto/greetings.git

      - name: Login to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_KEY_JSON }}'

      - name: Configure gcloud
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud config set compute/region ${{ secrets.CLOUD_RUN_REGION }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.CLOUD_RUN_SERVICE_NAME }} \
            --image=${{ secrets.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/greetings:latest \
            --platform=managed \
            --region=${{ secrets.CLOUD_RUN_REGION }} \
            --allow-unauthenticated
